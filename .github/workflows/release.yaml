name: Build and Release
on:
  push:
    tags:
      # Matches standard semver tags like v1.0.0, v1.0.0-beta.1, v2.1.3-rc1, etc.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cache Dependency
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Test Code
        run: |
          just test

      - name: Build Code
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "Pre-release detected. Running Beta build..."
            just Beta true
          else
            echo "Stable release detected. Running Stable build..."
            just Stable true
          fi
      - name: Package Source Code
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "Pre-release detected. Running Beta build..."
            zip -r Build/Debug/HermesKit_source.zip . \
              -x ".git/*" \
              -x ".github/*" \
              -x "target/*" \
              -x "Build/*" \
              -x "Lib/*" \
              -x "Include/*"
          else
            echo "Stable release detected. Running Stable build..."
            zip -r Build/Release/HermesKit_source.zip . \
              -x ".git/*" \
              -x ".github/*" \
              -x "target/*" \
              -x "Build/*" \
              -x "Lib/*" \
              -x "Include/*"
          fi
      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # Automatically uses Build/Debug/* for betas and Build/Release/* for stable versions
          files: |
            ${{ contains(github.ref, '-') && 'Build/Debug/*' || 'Build/Release/*' }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
