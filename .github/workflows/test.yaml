name: test-code

on: push
jobs:
  job1:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cache Dependency
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Setup Tools
        run: |
            go mod download
            go install gotest.tools/gotestsum@latest

      - name: Test Code
        run: |
          just test
